name: Publish TypeScript

on:
  push:
    tags:
      - 'ts-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected ts-v* tag to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use trusted-publishing npm CLI
        run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Verify locked Rollup native package
        run: node -e "require('rollup/parseAst').parseAst('export const value = 1'); console.log('Rollup native parser OK')"
      - name: Check release version
        shell: bash
        run: |
          package_version="$(node -p 'require("./packages/ts/package.json").version')"
          if [[ "$GITHUB_EVENT_NAME" == "push" || "${{ inputs.publish }}" == "true" ]]; then
            test "$GITHUB_REF_TYPE" = "tag"
            [[ "$GITHUB_REF_NAME" == ts-v* ]]
            tag_version="${GITHUB_REF_NAME#ts-v}"
            test "$tag_version" = "$package_version"
          fi
      - run: npm run type-check -w packages/ts
      - run: npm test -w packages/ts
      - run: npm run lint -w packages/ts
      - run: npm run build -w packages/ts
      - run: npm run audit:pack -w packages/ts
      - run: npm run test:package -w packages/ts
      - name: Publish with npm trusted publishing
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ts-v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        working-directory: packages/ts
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#ts-v}"
          npm_tag="latest"
          if [[ "$tag_version" == *-* ]]; then
            npm_tag="preview"
          fi
          npm publish --provenance --access public --tag "$npm_tag"
