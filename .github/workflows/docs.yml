name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-api-snapshot.yml'
      - '.github/scripts/deploy-docs-origin.sh'
      - '.github/scripts/generate-api-snapshot.mjs'
      - '.github/scripts/purge_edgeone.py'
      - '.github/scripts/test_purge_edgeone.py'
      - '.github/scripts/test-deploy-docs-origin.mjs'
      - 'scripts/sm9-native.ps1'
      - '.github/workflows/sm9-native.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-api-snapshot.yml'
      - '.github/scripts/deploy-docs-origin.sh'
      - '.github/scripts/generate-api-snapshot.mjs'
      - '.github/scripts/purge_edgeone.py'
      - '.github/scripts/test_purge_edgeone.py'
      - '.github/scripts/test-deploy-docs-origin.mjs'
      - 'scripts/sm9-native.ps1'
      - '.github/workflows/sm9-native.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified artifact to the CN origin
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCS_ARTIFACT_NAME: gmkit-docs-${{ github.run_id }}

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: docs/site/examples/go/go.mod
          cache-dependency-path: docs/site/examples/go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit/pom.xml
            packages/java/gmkit-sm9/pom.xml
            docs/site/examples/hutool/pom.xml
      - run: npm ci
      - name: Repair Rollup optional native package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
      - name: Verify EdgeOne client
        run: python .github/scripts/test_purge_edgeone.py
      - name: Verify deployment script syntax
        run: bash -n .github/scripts/deploy-docs-origin.sh
      - name: Verify documentation
        run: npm run docs:verify
      - name: Write deployment manifest
        run: node docs/site/scripts/write-deployment-manifest.mjs
      - name: Upload verified site
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DOCS_ARTIFACT_NAME }}
          path: docs/site/.vuepress/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy CN origin
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-latest
    environment: docs-production
    concurrency:
      group: docs-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.DOCS_ARTIFACT_NAME }}
          path: site
      - name: Deploy CN origin
        env:
          DOCS_SOURCE_DIR: ${{ github.workspace }}/site
          DOCS_REMOTE_DIR: /home/gmkit-site/www/
          DEPLOY_COMMIT: ${{ github.sha }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_REMOTE_USER: ${{ secrets.USER }}
          SSH_REMOTE_HOST: ${{ secrets.CN_HOST }}
          SSH_HOST_FINGERPRINT: ${{ secrets.CN_SSH_HOST_FINGERPRINT }}
        run: bash .github/scripts/deploy-docs-origin.sh
      - name: Purge EdgeOne CN
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID_CN }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY_CN }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID_CN }}
          EDGEONE_TARGETS: gmkit.cn,www.gmkit.cn
          EDGEONE_SITE_TYPE: cn
        run: python .github/scripts/purge_edgeone.py
      - name: Verify canonical deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' https://gmkit.cn/deployment.json \
              | grep --fixed-strings "\"commit\": \"$EXPECTED_COMMIT\""; then
              www_redirect=$(curl --silent --show-error --max-time 20 \
                --output /dev/null --write-out '%{redirect_url}' \
                https://www.gmkit.cn/deployment.json || true)
              if [[ "$www_redirect" == "https://gmkit.cn/deployment.json" ]]; then
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Canonical deployment or www HTTPS redirect was not ready after EdgeOne purge" >&2
          exit 1
