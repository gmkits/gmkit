name: Publish Java

on:
  push:
    tags:
      - 'java-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected java-v* tag to Maven Central
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-java-${{ github.ref }}
  cancel-in-progress: false

env:
  GMSSL_COMMIT: d655c06b3a6b0fe8cff900f293bf0e5aac6eb0a2

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit/pom.xml
            packages/java/gmkit-sm9/pom.xml
            packages/java/gmkit-bom/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - id: version
        name: Check release version
        shell: bash
        run: |
          pom_version="$(mvn -f packages/java/pom.xml -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$GITHUB_EVENT_NAME" == "push" || "${{ inputs.publish }}" == "true" ]]; then
            test "$GITHUB_REF_TYPE" = "tag"
            [[ "$GITHUB_REF_NAME" == java-v* ]]
            tag_version="${GITHUB_REF_NAME#java-v}"
            test "$tag_version" = "$pom_version"
          fi
          echo "version=$pom_version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Repair Rollup optional native package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
      - name: Java tests
        run: mvn -f packages/java/pom.xml -B -ntp test
      - name: Java and TypeScript parity
        run: npm run parity
      - name: Release artifacts
        run: mvn -f packages/java/pom.xml -B -ntp -Prelease -Dgpg.skip=true -DskipTests verify

  build-native-runtimes:
    needs: verify-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            generator: ''
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            generator: ''
          - os: macos-15-intel
            platform: darwin-x86_64
            generator: ''
          - os: macos-14
            platform: darwin-aarch64
            generator: ''
          - os: windows-2022
            platform: windows-x86_64
            generator: 'Visual Studio 17 2022'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit-sm9/pom.xml
      - name: Verify single-platform packaging contract
        shell: pwsh
        run: ./scripts/test-sm9-native-contract.ps1

      - name: Build and test SM9 native runtime
        shell: pwsh
        run: |
          $scriptArgs = @{
            Platform = '${{ matrix.platform }}'
            GmsslRef = $env:GMSSL_COMMIT
            Test = $true
          }
          if ('${{ matrix.generator }}') {
            $scriptArgs.Generator = '${{ matrix.generator }}'
          }
          ./scripts/sm9-native.ps1 @scriptArgs
      - name: Upload native runtime
        uses: actions/upload-artifact@v7
        with:
          name: sm9-native-${{ matrix.platform }}
          path: packages/java/target/sm9-native/${{ matrix.platform }}/runtime/*
          if-no-files-found: error
          retention-days: 3

  package-runtime:
    needs:
      - verify-release
      - build-native-runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit/pom.xml
            packages/java/gmkit-sm9/pom.xml
            packages/java/gmkit-bom/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: actions/download-artifact@v8
        with:
          pattern: sm9-native-*
          path: native-download
      - name: Assemble all-platform runtime
        run: >
          node scripts/assemble-sm9-runtime.mjs
          --input native-download
          --output packages/java/gmkit-sm9/target/generated-resources/sm9-runtime
          --gmssl-commit "$GMSSL_COMMIT"
      - name: Build file-repository release
        run: >
          mvn -f packages/java/pom.xml -B -ntp
          -Psm9-runtime-bundle,release
          -Dgpg.skip=true -DskipTests
          "-DaltDeploymentRepository=release::file://${{ runner.temp }}/maven-release"
          deploy
      - name: Audit file-repository release
        run: >
          node scripts/audit-maven-release.mjs
          --repository "${{ runner.temp }}/maven-release"
          --version "${{ needs.verify-release.outputs.version }}"
          --gmssl-commit "$GMSSL_COMMIT"
      - name: Upload aggregate SM9 JAR
        uses: actions/upload-artifact@v7
        with:
          name: gmkit-sm9-aggregate
          path: packages/java/gmkit-sm9/target/gmkit-sm9-${{ needs.verify-release.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 3
      - name: Upload aggregate runtime resources
        uses: actions/upload-artifact@v7
        with:
          name: sm9-runtime-bundle
          path: packages/java/gmkit-sm9/target/generated-resources/sm9-runtime/**
          if-no-files-found: error
          retention-days: 3

  test-packaged-runtime:
    needs: package-runtime
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15-intel
            platform: darwin-x86_64
          - os: macos-14
            platform: darwin-aarch64
          - os: windows-2022
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit-sm9/pom.xml
      - uses: actions/download-artifact@v8
        with:
          name: gmkit-sm9-aggregate
          path: aggregate
      - name: Compile packaged-runtime smoke test
        run: mvn -f packages/java/pom.xml -B -ntp -pl gmkit-sm9 -DskipTests test-compile
      - name: Test aggregate JAR
        shell: pwsh
        run: |
          $jar = Get-ChildItem -LiteralPath aggregate -Filter 'gmkit-sm9-*.jar' | Select-Object -First 1
          if (-not $jar) {
            throw 'gmkit-sm9 aggregate JAR not found'
          }
          $testClasses = Resolve-Path 'packages/java/gmkit-sm9/target/test-classes'
          $classpath = "$($jar.FullName)$([IO.Path]::PathSeparator)$testClasses"
          & java '-Dgmkit.sm9.requireNative=true' -cp $classpath cn.gmkit.sm9.SM9PackagedRuntimeSmoke
          if ($LASTEXITCODE -ne 0) {
            throw 'gmkit-sm9 aggregate JAR smoke test failed'
          }

  maven-central:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/java-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs:
      - verify-release
      - test-packaged-runtime
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - name: Require Maven Central credentials
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          test -n "$CENTRAL_TOKEN_USERNAME"
          test -n "$CENTRAL_TOKEN_PASSWORD"
          test -n "$MAVEN_GPG_PRIVATE_KEY"
          test -n "$MAVEN_GPG_PASSPHRASE"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit/pom.xml
            packages/java/gmkit-sm9/pom.xml
            packages/java/gmkit-bom/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: actions/download-artifact@v8
        with:
          name: sm9-runtime-bundle
          path: packages/java/gmkit-sm9/target/generated-resources/sm9-runtime
      # Central Publishing 扩展不会遵守 benchmark 模块的 maven.deploy.skip，必须显式限制 reactor。
      - name: Audit signed release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          mvn -f packages/java/pom.xml -B -ntp
          -Psm9-runtime-bundle,release -DskipTests
          -pl gmkit-bom,gmkit,gmkit-sm9 -am
          "-DaltDeploymentRepository=release::file://${{ runner.temp }}/signed-maven-release"
          deploy
      - name: Verify signed artifacts
        run: >
          node scripts/audit-maven-release.mjs
          --repository "${{ runner.temp }}/signed-maven-release"
          --version "${{ needs.verify-release.outputs.version }}"
          --gmssl-commit "$GMSSL_COMMIT"
          --require-signatures
      - name: Publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          mvn -f packages/java/pom.xml -B -ntp
          -Psm9-runtime-bundle,release,central-publish
          -DskipTests -pl gmkit-bom,gmkit,gmkit-sm9 -am deploy
