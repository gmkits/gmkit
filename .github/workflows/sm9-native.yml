name: SM9 Native

on:
  push:
    paths:
      - 'packages/java/gmkit-sm9/**'
      - 'packages/java/pom.xml'
      - 'scripts/sm9-native.ps1'
      - 'scripts/test-sm9-native-contract.ps1'
      - '.github/workflows/sm9-native.yml'
  pull_request:
    paths:
      - 'packages/java/gmkit-sm9/**'
      - 'packages/java/pom.xml'
      - 'scripts/sm9-native.ps1'
      - 'scripts/test-sm9-native-contract.ps1'
      - '.github/workflows/sm9-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm9-native-${{ github.ref }}
  cancel-in-progress: true

env:
  GMSSL_REF: d655c06b3a6b0fe8cff900f293bf0e5aac6eb0a2

jobs:
  native-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            generator: ''
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            generator: ''
          - os: macos-15-intel
            platform: darwin-x86_64
            generator: ''
          - os: macos-14
            platform: darwin-aarch64
            generator: ''
          - os: windows-2022
            platform: windows-x86_64
            generator: 'Visual Studio 17 2022'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit-sm9/pom.xml

      - name: Verify single-platform packaging contract
        shell: pwsh
        run: ./scripts/test-sm9-native-contract.ps1

      - name: Build and test SM9 JNI runtime
        shell: pwsh
        run: |
          $scriptArgs = @{
            Platform = '${{ matrix.platform }}'
            GmsslRef = $env:GMSSL_REF
            Stage = $true
            PackageRuntime = $true
            Test = $true
          }
          if ('${{ matrix.generator }}') {
            $scriptArgs.Generator = '${{ matrix.generator }}'
          }
          ./scripts/sm9-native.ps1 @scriptArgs
