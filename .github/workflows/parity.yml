name: Parity

on:
  push:
    paths:
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/parity.yml'
  pull_request:
    paths:
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-parity:
    name: Java / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit/pom.xml
      - name: Java interop compliance
        run: mvn -f packages/java/pom.xml -B -ntp -pl gmkit -Dtest=cn.gmkit.InteropComplianceTest test

  ts-parity:
    name: TypeScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Work around npm optional dependency bug (rollup native binary)
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
      - name: TypeScript interop compliance
        working-directory: packages/ts
        run: npx vitest run test/interop-compliance.test.ts
