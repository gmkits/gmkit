name: CI

on:
  push:
    paths:
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'docs/**'
      - 'apps/gmkit-studio/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'docs/**'
      - 'apps/gmkit-studio/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 工具链最低 Node 22.15；发布库的 Node 18/20 兼容由独立制品消费验证。
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Repair Rollup optional native package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
      - run: npm run type-check -w packages/ts
      - run: npm run lint -w packages/ts
      - run: npm test -w packages/ts
      - if: matrix.node == '22.x'
        run: npm run test:coverage -w packages/ts
      - run: npm run build -w packages/ts
      - run: npm run audit:pack -w packages/ts
      - run: npm run test:package-negative -w packages/ts
      - run: npm run test:package -w packages/ts
      - name: Pack consumer artifact
        if: matrix.node == '22.x'
        run: |
          mkdir -p artifacts/package
          npm pack -w packages/ts --pack-destination artifacts/package
      - uses: actions/upload-artifact@v7
        if: matrix.node == '22.x'
        with:
          name: gmkitx-consumer-package
          path: artifacts/package/*.tgz
          if-no-files-found: error

  ts-consumer:
    name: Package consumer / Node ${{ matrix.node }}
    needs: ts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: gmkitx-consumer-package
          path: artifacts/package
      - name: Consume the verified tarball without workspace dependencies
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=("$GITHUB_WORKSPACE"/artifacts/package/*.tgz)
          test "${#tarballs[@]}" -eq 1
          npm run test:package -w packages/ts -- --tarball "${tarballs[0]}"

  java:
    name: Java / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit/pom.xml
            packages/java/gmkit-sm9/pom.xml
            packages/java/gmkit-bom/pom.xml
            packages/java/gmkit-benchmarks/pom.xml
      - run: mvn -f packages/java/pom.xml -B -ntp test
